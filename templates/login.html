{% extends "base.html" %}
{% block title %}Iniciar sesión · Certificados{% endblock %}
{% block content %}
<div class="login-page">
  <div class="form-card login-card">
    <div class="form-title">
      <span class="eyebrow">ACCESO PRIVADO</span>
      <h1>Iniciar sesión</h1>
      <p>Ingresá con tu correo <strong>o</strong> tu celular y la contraseña.</p>
    </div>

    <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="fields">
        <div>
          <label for="identifier">Correo electrónico o celular</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" placeholder="Correo o número de celular" required autofocus>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <button class="primary large login-submit" type="submit">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
