{% extends "base.html" %}
{% block title %}Iniciar sesión · Certificados{% endblock %}
{% block content %}
<div class="login-page">
  <div class="form-card login-card">
    <div class="form-title">
      <span class="eyebrow">ACCESO PRIVADO</span>
      <h1>Iniciar sesión</h1>
      <p>Ingresá con el correo y celular autorizados para administrar los certificados.</p>
    </div>

    <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="fields">
        <div>
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div>
          <label for="phone">Número de celular</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <button class="primary large login-submit" type="submit">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
